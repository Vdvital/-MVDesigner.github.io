<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>Catálogo</title>
<link rel="stylesheet" href="css/loja.css">
</head>
<body>
<div id="loading" class="state"><div class="spinner" aria-hidden="true"></div><p>Carregando catálogo…</p></div>

<div id="unavailable" class="state" hidden>
  <h1>Catálogo indisponível</h1>
  <p id="unavailable-msg">Este catálogo não está disponível no momento.</p>
</div>

<div id="app" hidden>
  <header class="hero" id="hero">
    <div class="hero-inner">
      <h1 id="store-name"></h1>
      <p id="store-about"></p>
      <div class="hero-links" id="hero-links"></div>
    </div>
  </header>

  <nav class="filters" aria-label="Filtrar produtos">
    <div class="filters-inner">
      <input id="q" type="search" placeholder="Buscar produto ou código" aria-label="Buscar produto">
      <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
    </div>
  </nav>

  <main class="content">
    <section id="promo-section" hidden aria-labelledby="promo-title">
      <h2 id="promo-title"><span class="dot" aria-hidden="true"></span> Promoções</h2>
      <div class="promo-row" id="promo-row"></div>
    </section>
    <section aria-labelledby="all-title">
      <h2 id="all-title">Produtos <small id="count"></small></h2>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Nenhum produto encontrado.</p>
      <button class="more" id="more" hidden>Ver mais produtos</button>
    </section>
  </main>

  <footer class="foot"><span id="foot-name"></span> · Catálogo online</footer>
  <a class="wa-float" id="wa-float" target="_blank" rel="noopener" hidden aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3z"/></svg>
  </a>
</div>

<dialog id="detail" aria-labelledby="d-name">
  <button class="close" id="d-close" aria-label="Fechar">×</button>
  <div class="d-gallery"><div class="d-main" id="d-main"></div><div class="d-thumbs" id="d-thumbs"></div></div>
  <div class="d-info">
    <span class="d-code" id="d-code"></span>
    <h3 id="d-name"></h3>
    <div class="price" id="d-price"></div>
    <p id="d-desc"></p>
    <a class="btn-wa" id="d-wa" target="_blank" rel="noopener">Pedir pelo WhatsApp</a>
  </div>
</dialog>

<script src="config.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/loja.js"></script>
</body>
</html>
