<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Orçamento</title>
<link rel="stylesheet" href="css/loja.css?v=202611201401">
<style>
  .q-wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
  .q-head{background:var(--accent);color:#111;border-radius:18px;padding:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .q-brand{display:flex;align-items:center;gap:14px}
  .q-brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
  .q-head h1{margin:0;font-size:24px;letter-spacing:-.6px}
  .q-head small{display:block;opacity:.8;font-weight:600}
  .q-head .num{text-align:right;font-weight:800}
  .q-head.dark{color:#fff}
  .q-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
  .q-meta div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;min-width:0}
  .q-sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .q-meta span{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
  .q-items{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .q-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .q-row:last-child{border-bottom:0}
  .q-row img,.q-row .no-img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#efeeea;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;font-weight:800}
  .q-row small{color:var(--muted)}
  .q-row .sub{text-align:right;font-weight:800;white-space:nowrap}
  .q-total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px;font-size:16px}
  .q-total strong{font-size:28px;letter-spacing:-.6px}
  .q-obs{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px;white-space:pre-line}
  .q-actions{display:flex;flex-direction:column;gap:8px}
  .q-actions .btn-wa,.q-actions .btn-pdf{border:0;cursor:pointer;font-size:16px;padding:15px}
  .q-actions .btn-pdf{border:1.5px solid var(--ink)}
  .q-note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:16px}
  @media(max-width:560px){.q-meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loading" class="state"><div class="spinner" aria-hidden="true"></div><p>Carregando orçamento…</p></div>
<div id="unavailable" class="state" hidden><h1>Orçamento não encontrado</h1><p>Confira o link recebido.</p></div>

<main class="q-wrap" id="app" hidden>
  <header class="q-head" id="q-head">
    <div class="q-brand"><img id="q-logo" alt="" hidden><div><small>Orçamento</small><h1 id="q-store"></h1></div></div>
    <div class="num"><span id="q-number"></span><small id="q-date"></small></div>
  </header>
  <section class="q-meta" aria-label="Dados do orçamento">
    <div><span>Cliente</span><b id="q-client"></b><small class="q-sub" id="q-client-sub"></small></div>
    <div><span id="q-seller-role">Vendedor</span><b id="q-seller"></b></div>
    <div><span>Validade</span><b id="q-valid"></b></div>
  </section>
  <section class="q-items" id="q-items" aria-label="Produtos"></section>
  <div class="q-total"><span id="q-count"></span><strong id="q-total"></strong></div>
  <div class="q-obs" id="q-obs" hidden></div>
  <div class="q-actions">
    <button class="btn-wa" id="q-pdf">Baixar PDF do orçamento</button>
    <button class="btn-pdf" id="q-share" hidden>Enviar PDF pelo WhatsApp</button>
  </div>
  <p class="q-note">Preços e disponibilidade sujeitos a confirmação no fechamento do pedido.</p>
</main>

<script src="config.js?v=202611201401"></script>
<script src="js/db.js?v=202611201401"></script>
<script src="js/common.js?v=202611201401"></script>
<script src="js/orcamento.js?v=202611201401"></script>
<script>
(async () => {
  const { $, esc } = U;
  const id = new URLSearchParams(location.search).get("id") || "";
  const fail = () => { $("#loading").hidden = true; $("#unavailable").hidden = false; };
  let q = null;
  try { if (id) q = await DB.getQuote(id); } catch { q = null; }
  if (!q) return fail();

  if (q.store.logo) {
    U.setFavicon(q.store.logo);
    const lg = $("#q-logo"); lg.src = q.store.logo; lg.hidden = false;
  }
  const accent = q.store.accent || "#ff6a36";
  document.documentElement.style.setProperty("--accent", accent);
  const rgb = parseInt(accent.replace("#", ""), 16);
  if ((0.299 * (rgb >> 16 & 255) + 0.587 * (rgb >> 8 & 255) + 0.114 * (rgb & 255)) <= 160) $("#q-head").classList.add("dark");
  document.title = `Orçamento ${q.number} — ${q.store.name}`;
  const created = new Date(q.createdAt || Date.now());
  $("#q-store").textContent = q.store.name || "Catálogo";
  $("#q-number").textContent = `Nº ${q.number}`;
  $("#q-date").textContent = created.toLocaleDateString("pt-BR");
  $("#q-client").textContent = q.client;
  $("#q-client-sub").textContent = [q.clientDoc && `${U.docLabel(q.clientDoc)} ${q.clientDoc}`, q.clientPhone].filter(Boolean).join(" · ");
  $("#q-seller-role").textContent = q.seller.role || "Vendedor";
  $("#q-seller").textContent = q.seller.name;
  $("#q-valid").textContent = new Date(created.getTime() + 7 * 86400000).toLocaleDateString("pt-BR");

  let total = 0, units = 0;
  $("#q-items").innerHTML = q.items.map((it) => {
    const sub = it.unit != null ? it.unit * it.qty : null;
    if (sub != null) total += sub; units += it.qty;
    return `<div class="q-row">${U.imgTag(it, 160, "")}
      <div><span class="code-row"><small>Cód. ${esc(it.code)}</small>${U.boxBadge(it, "sm")}</span><b>${esc(it.name)}</b><br><small>${it.qty} × ${it.unit != null ? U.money(it.unit) : "a consultar"}</small></div>
      <div class="sub">${sub != null ? U.money(sub) : "—"}</div></div>`;
  }).join("");
  $("#q-count").textContent = `${q.items.length} produtos · ${units} unidades`;
  $("#q-total").textContent = U.money(total);
  if (q.obs) { $("#q-obs").hidden = false; $("#q-obs").textContent = "Obs.: " + q.obs; }
  $("#loading").hidden = true; $("#app").hidden = false;

  /* PDF */
  let file = null;
  async function getPdf() {
    if (file) return file;
    const out = await Orcamento.build({
      store: q.store, client: q.client, clientDoc: q.clientDoc, clientPhone: q.clientPhone, obs: q.obs, number: q.number, seller: q.seller,
      items: q.items.map((it) => ({ p: it, qty: it.qty, unit: it.unit }))
    });
    file = new File([out.blob], out.filename, { type: "application/pdf" });
    return file;
  }
  const btn = $("#q-pdf");
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Gerando PDF…";
    try {
      const f = await getPdf();
      const url = URL.createObjectURL(f);
      const a = document.createElement("a"); a.href = url; a.download = f.name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.parentNode.removeChild(a); }, 2000);
    } catch (e) { U.toast(e.message, "err"); }
    btn.disabled = false; btn.textContent = "Baixar PDF do orçamento";
  };
  // No celular: depois de gerar, dá para mandar o arquivo direto ao cliente
  try {
    const f = await getPdf();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      $("#q-share").hidden = false;
      $("#q-share").onclick = async () => {
        try { await navigator.share({ files: [f], title: f.name }); }
        catch (e) { if (e.name !== "AbortError") U.toast("Não foi possível compartilhar. Use \"Baixar PDF\".", "err"); }
      };
    }
  } catch { /* o botão de baixar continua funcionando */ }
})();
</script>
</body>
</html>
